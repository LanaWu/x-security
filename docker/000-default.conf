<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/x-security
    TraceEnable Off

    <Directory /var/www/x-security>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
